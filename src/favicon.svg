<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ballGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0d1f33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo circular (balón) -->
  <circle cx="50" cy="50" r="48" fill="url(#ballGradient)" stroke="#1a3a5c" stroke-width="2" filter="url(#shadow)"/>

  <!-- Pentágonos del balón de fútbol -->
  <g fill="#1a3a5c">
    <!-- Centro -->
    <polygon points="50,25 62,35 58,50 42,50 38,35"/>
    <!-- Arriba izquierda -->
    <polygon points="25,45 35,32 42,42 38,55 25,52"/>
    <!-- Arriba derecha -->
    <polygon points="75,45 65,32 58,42 62,55 75,52"/>
    <!-- Abajo izquierda -->
    <polygon points="32,72 25,60 38,55 48,65 42,78"/>
    <!-- Abajo derecha -->
    <polygon points="68,72 75,60 62,55 52,65 58,78"/>
  </g>

  <!-- Líneas del balón -->
  <g stroke="#1a3a5c" stroke-width="1.5" fill="none">
    <line x1="50" y1="25" x2="50" y2="8"/>
    <line x1="62" y1="35" x2="78" y2="22"/>
    <line x1="58" y1="50" x2="75" y2="52"/>
    <line x1="42" y1="50" x2="25" y2="52"/>
    <line x1="38" y1="35" x2="22" y2="22"/>
    <line x1="48" y1="65" x2="50" y2="85"/>
    <line x1="52" y1="65" x2="50" y2="85"/>
  </g>

  <!-- Mini escudo en el centro -->
  <g transform="translate(35, 38)">
    <path d="M15,0 L28,5 L28,18 C28,25 15,30 15,30 C15,30 2,25 2,18 L2,5 Z" fill="url(#shieldGradient)" stroke="#ffde00" stroke-width="1.5"/>
    <!-- Franja amarilla en el escudo -->
    <rect x="2" y="12" width="26" height="6" fill="#ffde00"/>
    <!-- PV iniciales -->
    <text x="15" y="10" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#ffde00" text-anchor="middle">PV</text>
  </g>
</svg>
